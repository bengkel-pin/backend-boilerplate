openapi: 3.0.3
info:
  title: IndahJaya Bangunan API
  description: |
    REST API untuk sistem dashboard admin **IndahJaya Bangunan**.

    ## Autentikasi
    API ini menggunakan **Bearer Token (JWT)**. Lakukan login terlebih dahulu melalui endpoint `/auth/login`, kemudian gunakan `accessToken` yang diterima pada header:
    ```
    Authorization: Bearer <accessToken>
    ```

    ## Roles
    | Role | Keterangan |
    |------|------------|
    | `ADMIN` | Akses penuh ke semua endpoint |
    | `MANAGER` | Akses baca user, kelola media, lihat dashboard |
    | `STAFF` | Upload media saja |
  version: 1.0.0
  contact:
    name: IndahJaya Bangunan
    email: admin@indahjayabangunan.com

servers:
  - url: http://localhost:5000/api
    description: Development server

tags:
  - name: Health
    description: Status server
  - name: Auth
    description: Autentikasi dan manajemen sesi
  - name: Users
    description: Manajemen data user
  - name: Media
    description: Upload dan manajemen file
  - name: Dashboard
    description: Statistik dan log aktivitas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 10

    User:
      type: object
      properties:
        id:
          type: string
          example: clx1234abcd
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@indahjayabangunan.com
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]
          example: STAFF
        avatar:
          type: string
          nullable: true
          example: null
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    Media:
      type: object
      properties:
        id:
          type: string
          example: clx5678efgh
        filename:
          type: string
          example: 1716000000000-123456789.jpg
        originalName:
          type: string
          example: foto-toko.jpg
        mimetype:
          type: string
          example: image/jpeg
        size:
          type: integer
          example: 204800
        path:
          type: string
          example: uploads/images/1716000000000-123456789.jpg
        uploadedById:
          type: string
          example: clx1234abcd
        createdAt:
          type: string
          format: date-time

    ActivityLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        action:
          type: string
          example: CREATE
        entity:
          type: string
          example: User
        entityId:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Token tidak valid atau tidak ada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token tidak ditemukan
    Forbidden:
      description: Tidak memiliki izin akses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Akses tidak diizinkan
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data tidak ditemukan

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek status server
      security: []
      responses:
        '200':
          description: Server berjalan normal
          content:
            application/json:
              example:
                success: true
                message: Server IndahJaya Bangunan berjalan dengan baik
                timestamp: '2024-01-01T00:00:00.000Z'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Autentikasi user dan dapatkan access token + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@indahjayabangunan.com
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              example:
                success: true
                message: Login berhasil
                data:
                  user:
                    id: clx1234abcd
                    name: Administrator
                    email: admin@indahjayabangunan.com
                    role: ADMIN
                    isActive: true
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Email atau password salah
          content:
            application/json:
              example:
                success: false
                message: Email atau password salah

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Perbarui access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token berhasil diperbarui
          content:
            application/json:
              example:
                success: true
                message: Token diperbarui
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil data profil sendiri
      responses:
        '200':
          description: Data profil berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Ganti password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: admin123
                newPassword:
                  type: string
                  example: newpassword123
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              example:
                success: true
                message: Password berhasil diubah
                data: null
        '400':
          description: Password lama tidak sesuai
          content:
            application/json:
              example:
                success: false
                message: Password lama tidak sesuai
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Daftar semua user
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          example: 10
        - in: query
          name: search
          schema:
            type: string
          description: Cari berdasarkan nama atau email
          example: budi
        - in: query
          name: role
          schema:
            type: string
            enum: [ADMIN, MANAGER, STAFF]
          example: STAFF
      responses:
        '200':
          description: Data user berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Data user berhasil diambil
                data:
                  - id: clx1234abcd
                    name: Administrator
                    email: admin@indahjayabangunan.com
                    role: ADMIN
                    isActive: true
                    createdAt: '2024-01-01T00:00:00.000Z'
                pagination:
                  total: 1
                  page: 1
                  limit: 10
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Buat user baru
      description: Hanya dapat diakses oleh **ADMIN**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  example: budi@indahjayabangunan.com
                password:
                  type: string
                  example: password123
                role:
                  type: string
                  enum: [ADMIN, MANAGER, STAFF]
                  example: STAFF
      responses:
        '201':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email sudah digunakan
          content:
            application/json:
              example:
                success: false
                message: Data sudah ada (duplikasi)

  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        example: clx1234abcd

    get:
      tags: [Users]
      summary: Detail user berdasarkan ID
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      responses:
        '200':
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update data user
      description: Hanya dapat diakses oleh **ADMIN**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Budi Santoso Updated
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [ADMIN, MANAGER, STAFF]
                isActive:
                  type: boolean
      responses:
        '200':
          description: User berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Hapus user
      description: Hanya dapat diakses oleh **ADMIN**. Tidak bisa menghapus akun sendiri.
      responses:
        '200':
          description: User berhasil dihapus
          content:
            application/json:
              example:
                success: true
                message: User berhasil dihapus
                data: null
        '400':
          description: Tidak bisa menghapus akun sendiri
          content:
            application/json:
              example:
                success: false
                message: Tidak bisa menghapus akun sendiri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /media:
    get:
      tags: [Media]
      summary: Daftar semua media
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: type
          schema:
            type: string
            enum: [image, document]
          description: Filter berdasarkan tipe file
      responses:
        '200':
          description: Data media berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Data media berhasil diambil
                data:
                  - id: clx5678efgh
                    filename: 1716000000000-123456789.jpg
                    originalName: foto-toko.jpg
                    mimetype: image/jpeg
                    size: 204800
                    path: uploads/images/1716000000000-123456789.jpg
                    uploadedById: clx1234abcd
                    createdAt: '2024-01-01T00:00:00.000Z'
                pagination:
                  total: 1
                  page: 1
                  limit: 20
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/upload:
    post:
      tags: [Media]
      summary: Upload file
      description: |
        Upload file ke server. Format yang didukung:
        - **Gambar:** JPG, PNG, WEBP
        - **Dokumen:** PDF, DOC, DOCX

        Ukuran maksimal: **5MB**
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File yang akan diupload
      responses:
        '201':
          description: File berhasil diupload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Media'
        '400':
          description: File tidak ada atau tipe tidak didukung
          content:
            application/json:
              example:
                success: false
                message: Tipe file tidak didukung. Gunakan JPG, PNG, WEBP, PDF, atau DOC/DOCX
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/{id}:
    delete:
      tags: [Media]
      summary: Hapus media
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: clx5678efgh
      responses:
        '200':
          description: Media berhasil dihapus
          content:
            application/json:
              example:
                success: true
                message: Media berhasil dihapus
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Statistik ringkasan dashboard
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      responses:
        '200':
          description: Statistik berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Statistik dashboard berhasil diambil
                data:
                  summary:
                    totalUsers: 10
                    activeUsers: 9
                    totalMedia: 25
                  usersByRole:
                    - role: ADMIN
                      count: 1
                    - role: MANAGER
                      count: 3
                    - role: STAFF
                      count: 6
                  mediaByMonth:
                    - month: '2024-01'
                      count: 5
                    - month: '2024-02'
                      count: 8
                  recentActivity: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard/activity-logs:
    get:
      tags: [Dashboard]
      summary: Log aktivitas sistem
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Log aktivitas berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Log aktivitas berhasil diambil
                data: []
                pagination:
                  total: 0
                  page: 1
                  limit: 20
                  totalPages: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
