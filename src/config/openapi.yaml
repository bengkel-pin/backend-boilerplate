openapi: 3.0.3
info:
  title: IndahJaya Bangunan API
  description: |
    REST API untuk sistem dashboard admin **IndahJaya Bangunan**.

    ## Autentikasi
    API ini menggunakan **Bearer Token (JWT)**. Lakukan login terlebih dahulu melalui endpoint `/auth/login`, kemudian gunakan `accessToken` yang diterima pada header:
    ```
    Authorization: Bearer <accessToken>
    ```

    ## Roles
    | Role | Keterangan |
    |------|------------|
    | `ADMIN` | Akses penuh ke semua endpoint |
    | `MANAGER` | Akses baca user, kelola media, lihat dashboard |
    | `STAFF` | Upload media saja |
  version: 1.0.0
  contact:
    name: IndahJaya Bangunan
    email: admin@indahjayabangunan.com

servers:
  - url: http://localhost:5000/api
    description: Development server

tags:
  - name: Health
    description: Status server
  - name: Auth
    description: Autentikasi dan manajemen sesi
  - name: Users
    description: Manajemen data user
  - name: Media
    description: Upload dan manajemen file
  - name: Dashboard
    description: Statistik dan log aktivitas
  - name: Karyawan
    description: Data induk karyawan (status & departemen dihitung otomatis)
  - name: Riwayat Kerja
    description: Riwayat masuk/keluar karyawan — sumber status & departemen aktif
  - name: Absensi
    description: Pencatatan kehadiran harian (Hadir / Cuti / Parsial)
  - name: Pinjaman
    description: Pinjaman karyawan yang dipotong dari gaji
  - name: Hutang
    description: Ledger hutang karyawan (jenis Hutang / Bayar)
  - name: Pembayaran Gaji
    description: Kalkulasi & pencatatan pembayaran gaji karyawan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 10

    User:
      type: object
      properties:
        id:
          type: string
          example: clx1234abcd
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@indahjayabangunan.com
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]
          example: STAFF
        avatar:
          type: string
          nullable: true
          example: null
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    Media:
      type: object
      properties:
        id:
          type: string
          example: clx5678efgh
        filename:
          type: string
          example: 1716000000000-123456789.jpg
        originalName:
          type: string
          example: foto-toko.jpg
        mimetype:
          type: string
          example: image/jpeg
        size:
          type: integer
          example: 204800
        path:
          type: string
          example: uploads/images/1716000000000-123456789.jpg
        uploadedById:
          type: string
          example: clx1234abcd
        createdAt:
          type: string
          format: date-time

    ActivityLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        action:
          type: string
          example: CREATE
        entity:
          type: string
          example: User
        entityId:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Karyawan:
      type: object
      properties:
        id:
          type: string
          example: KRY001
        nama:
          type: string
          example: Budi Santoso
        jenisKelamin:
          type: string
          enum: [LAKI_LAKI, PEREMPUAN]
        jabatan:
          type: string
          nullable: true
          example: Kasir
        nomorHp:
          type: string
          nullable: true
          example: "081234567890"
        noRekening:
          type: string
          nullable: true
          example: "1234567890"
        alamat:
          type: string
          nullable: true
        sistemUpah:
          type: string
          enum: [HARIAN, BULANAN]
        gajiPokok:
          type: number
          example: 150000
        statusBekerja:
          type: string
          enum: [AKTIF, NON_AKTIF]
          description: Dihitung otomatis dari riwayat kerja terbaru
        departemen:
          type: string
          enum: [TOKO, PROYEK]
          nullable: true
          description: Dihitung otomatis dari riwayat kerja aktif
        hutang:
          type: number
          example: 50000
          description: Saldo hutang bersih (Hutang - Bayar)

    RiwayatKerja:
      type: object
      properties:
        id:
          type: string
          example: clx1234abcd
        karyawanId:
          type: string
          example: KRY001
        tanggalMulai:
          type: string
          format: date
          example: "2024-01-01"
        tanggalKeluar:
          type: string
          format: date
          nullable: true
          example: null
        departemen:
          type: string
          enum: [TOKO, PROYEK]

    Absensi:
      type: object
      properties:
        id:
          type: string
        karyawanId:
          type: string
          example: KRY001
        tanggal:
          type: string
          format: date
          example: "2024-01-02"
        status:
          type: string
          enum: [HADIR, CUTI, PARSIAL]
        jamKerja:
          type: integer
          example: 8
          description: "HADIR=8, CUTI=0, PARSIAL=1-7"
        alasanKetidakhadiran:
          type: string
          nullable: true
        telatMenit:
          type: integer
          nullable: true
          example: 0

    Pinjaman:
      type: object
      properties:
        id:
          type: string
        karyawanId:
          type: string
          example: KRY001
        jumlah:
          type: number
          example: 500000
        alasanPeminjaman:
          type: string
          nullable: true
        tanggal:
          type: string
          format: date
        metodePembayaran:
          type: string
          enum: [TUNAI, TRANSFER]

    HutangKaryawan:
      type: object
      properties:
        id:
          type: string
        tanggal:
          type: string
          format: date
        karyawanId:
          type: string
          example: KRY001
        jenis:
          type: string
          enum: [HUTANG, BAYAR]
        jumlah:
          type: number
          example: 200000
        keterangan:
          type: string
          nullable: true
        refNoNota:
          type: string
          nullable: true
          example: INV-001

    PembayaranGaji:
      type: object
      properties:
        id:
          type: string
        periodeAwal:
          type: string
          format: date
          example: "2024-01-01"
        periodeAkhir:
          type: string
          format: date
          example: "2024-01-31"
        karyawanId:
          type: string
          example: KRY001
        namaKaryawan:
          type: string
          example: Budi Santoso
        gajiPokok:
          type: number
          example: 150000
        jumlahHariKerja:
          type: number
          example: 26.5
        jumlahJamKerja:
          type: integer
          example: 212
        total:
          type: number
          example: 3975000
        pinjaman:
          type: number
          example: 500000
        sisa:
          type: number
          example: 3475000
        metodeBayar:
          type: string
          enum: [TUNAI, TRANSFER]
        tanggalBayar:
          type: string
          format: date

  responses:
    Unauthorized:
      description: Token tidak valid atau tidak ada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token tidak ditemukan
    Forbidden:
      description: Tidak memiliki izin akses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Akses tidak diizinkan
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data tidak ditemukan

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek status server
      security: []
      responses:
        '200':
          description: Server berjalan normal
          content:
            application/json:
              example:
                success: true
                message: Server IndahJaya Bangunan berjalan dengan baik
                timestamp: '2024-01-01T00:00:00.000Z'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Autentikasi user dan dapatkan access token + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@indahjayabangunan.com
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              example:
                success: true
                message: Login berhasil
                data:
                  user:
                    id: clx1234abcd
                    name: Administrator
                    email: admin@indahjayabangunan.com
                    role: ADMIN
                    isActive: true
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Email atau password salah
          content:
            application/json:
              example:
                success: false
                message: Email atau password salah

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Perbarui access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token berhasil diperbarui
          content:
            application/json:
              example:
                success: true
                message: Token diperbarui
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil data profil sendiri
      responses:
        '200':
          description: Data profil berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Ganti password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: admin123
                newPassword:
                  type: string
                  example: newpassword123
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              example:
                success: true
                message: Password berhasil diubah
                data: null
        '400':
          description: Password lama tidak sesuai
          content:
            application/json:
              example:
                success: false
                message: Password lama tidak sesuai
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Daftar semua user
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          example: 10
        - in: query
          name: search
          schema:
            type: string
          description: Cari berdasarkan nama atau email
          example: budi
        - in: query
          name: role
          schema:
            type: string
            enum: [ADMIN, MANAGER, STAFF]
          example: STAFF
      responses:
        '200':
          description: Data user berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Data user berhasil diambil
                data:
                  - id: clx1234abcd
                    name: Administrator
                    email: admin@indahjayabangunan.com
                    role: ADMIN
                    isActive: true
                    createdAt: '2024-01-01T00:00:00.000Z'
                pagination:
                  total: 1
                  page: 1
                  limit: 10
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Buat user baru
      description: Hanya dapat diakses oleh **ADMIN**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  example: budi@indahjayabangunan.com
                password:
                  type: string
                  example: password123
                role:
                  type: string
                  enum: [ADMIN, MANAGER, STAFF]
                  example: STAFF
      responses:
        '201':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email sudah digunakan
          content:
            application/json:
              example:
                success: false
                message: Data sudah ada (duplikasi)

  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        example: clx1234abcd

    get:
      tags: [Users]
      summary: Detail user berdasarkan ID
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      responses:
        '200':
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update data user
      description: Hanya dapat diakses oleh **ADMIN**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Budi Santoso Updated
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [ADMIN, MANAGER, STAFF]
                isActive:
                  type: boolean
      responses:
        '200':
          description: User berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Hapus user
      description: Hanya dapat diakses oleh **ADMIN**. Tidak bisa menghapus akun sendiri.
      responses:
        '200':
          description: User berhasil dihapus
          content:
            application/json:
              example:
                success: true
                message: User berhasil dihapus
                data: null
        '400':
          description: Tidak bisa menghapus akun sendiri
          content:
            application/json:
              example:
                success: false
                message: Tidak bisa menghapus akun sendiri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /media:
    get:
      tags: [Media]
      summary: Daftar semua media
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: type
          schema:
            type: string
            enum: [image, document]
          description: Filter berdasarkan tipe file
      responses:
        '200':
          description: Data media berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Data media berhasil diambil
                data:
                  - id: clx5678efgh
                    filename: 1716000000000-123456789.jpg
                    originalName: foto-toko.jpg
                    mimetype: image/jpeg
                    size: 204800
                    path: uploads/images/1716000000000-123456789.jpg
                    uploadedById: clx1234abcd
                    createdAt: '2024-01-01T00:00:00.000Z'
                pagination:
                  total: 1
                  page: 1
                  limit: 20
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/upload:
    post:
      tags: [Media]
      summary: Upload file
      description: |
        Upload file ke server. Format yang didukung:
        - **Gambar:** JPG, PNG, WEBP
        - **Dokumen:** PDF, DOC, DOCX

        Ukuran maksimal: **5MB**
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File yang akan diupload
      responses:
        '201':
          description: File berhasil diupload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Media'
        '400':
          description: File tidak ada atau tipe tidak didukung
          content:
            application/json:
              example:
                success: false
                message: Tipe file tidak didukung. Gunakan JPG, PNG, WEBP, PDF, atau DOC/DOCX
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/{id}:
    delete:
      tags: [Media]
      summary: Hapus media
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: clx5678efgh
      responses:
        '200':
          description: Media berhasil dihapus
          content:
            application/json:
              example:
                success: true
                message: Media berhasil dihapus
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Statistik ringkasan dashboard
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      responses:
        '200':
          description: Statistik berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Statistik dashboard berhasil diambil
                data:
                  summary:
                    totalUsers: 10
                    activeUsers: 9
                    totalMedia: 25
                  usersByRole:
                    - role: ADMIN
                      count: 1
                    - role: MANAGER
                      count: 3
                    - role: STAFF
                      count: 6
                  mediaByMonth:
                    - month: '2024-01'
                      count: 5
                    - month: '2024-02'
                      count: 8
                  recentActivity: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard/activity-logs:
    get:
      tags: [Dashboard]
      summary: Log aktivitas sistem
      description: Hanya dapat diakses oleh **ADMIN** dan **MANAGER**
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Log aktivitas berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Log aktivitas berhasil diambil
                data: []
                pagination:
                  total: 0
                  page: 1
                  limit: 20
                  totalPages: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Karyawan ────────────────────────────────────────────────────

  /karyawan:
    get:
      tags: [Karyawan]
      summary: Daftar semua karyawan
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
        - { in: query, name: search, schema: { type: string }, description: Cari nama atau ID }
        - { in: query, name: status, schema: { type: string, enum: [AKTIF, NON_AKTIF] } }
        - { in: query, name: departemen, schema: { type: string, enum: [TOKO, PROYEK] } }
        - { in: query, name: sistemUpah, schema: { type: string, enum: [HARIAN, BULANAN] } }
      responses:
        '200':
          description: Data karyawan berhasil diambil
          content:
            application/json:
              example:
                success: true
                message: Data karyawan berhasil diambil
                data:
                  - id: KRY001
                    nama: Budi Santoso
                    jenisKelamin: LAKI_LAKI
                    jabatan: Kasir
                    sistemUpah: HARIAN
                    gajiPokok: 150000
                    statusBekerja: AKTIF
                    departemen: TOKO
                    hutang: 50000
                pagination: { total: 1, page: 1, limit: 10, totalPages: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Karyawan]
      summary: Tambah karyawan baru
      description: ID otomatis digenerate (KRY001, KRY002, ...). Role **ADMIN** atau **MANAGER**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, jenisKelamin, sistemUpah, gajiPokok]
              properties:
                nama:
                  type: string
                  example: Budi Santoso
                jenisKelamin:
                  type: string
                  enum: [LAKI_LAKI, PEREMPUAN]
                jabatan:
                  type: string
                  example: Kasir
                nomorHp:
                  type: string
                  example: "081234567890"
                noRekening:
                  type: string
                  example: "1234567890"
                alamat:
                  type: string
                sistemUpah:
                  type: string
                  enum: [HARIAN, BULANAN]
                gajiPokok:
                  type: number
                  example: 150000
      responses:
        '201':
          description: Karyawan berhasil ditambahkan
          content:
            application/json:
              example:
                success: true
                message: Karyawan berhasil ditambahkan
                data: { id: KRY001, nama: Budi Santoso, jenisKelamin: LAKI_LAKI, sistemUpah: HARIAN, gajiPokok: 150000 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /karyawan/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string }, example: KRY001 }

    get:
      tags: [Karyawan]
      summary: Detail karyawan beserta status & hutang
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Karyawan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Karyawan]
      summary: Update data karyawan
      description: Role **ADMIN** atau **MANAGER**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama: { type: string }
                jenisKelamin: { type: string, enum: [LAKI_LAKI, PEREMPUAN] }
                jabatan: { type: string }
                nomorHp: { type: string }
                noRekening: { type: string }
                alamat: { type: string }
                sistemUpah: { type: string, enum: [HARIAN, BULANAN] }
                gajiPokok: { type: number }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Karyawan]
      summary: Hapus karyawan (beserta seluruh data terkait)
      description: Role **ADMIN** saja.
      responses:
        '200':
          description: Karyawan berhasil dihapus
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Riwayat Kerja ───────────────────────────────────────────────

  /riwayat-kerja/karyawan/{karyawanId}:
    get:
      tags: [Riwayat Kerja]
      summary: Semua riwayat kerja satu karyawan
      parameters:
        - { in: path, name: karyawanId, required: true, schema: { type: string }, example: KRY001 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                success: true
                data:
                  - id: clxabc
                    karyawanId: KRY001
                    tanggalMulai: "2024-01-01"
                    tanggalKeluar: null
                    departemen: TOKO
        '401':
          $ref: '#/components/responses/Unauthorized'

  /riwayat-kerja:
    post:
      tags: [Riwayat Kerja]
      summary: Catat karyawan masuk kerja
      description: |
        Gagal jika karyawan masih punya riwayat aktif (`tanggalKeluar` kosong).
        Untuk re-hire: set `tanggalKeluar` dulu lalu buat riwayat baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [karyawanId, tanggalMulai, departemen]
              properties:
                karyawanId: { type: string, example: KRY001 }
                tanggalMulai: { type: string, format: date, example: "2024-01-01" }
                departemen: { type: string, enum: [TOKO, PROYEK] }
      responses:
        '201':
          description: Riwayat berhasil dicatat
        '400':
          description: Karyawan masih memiliki riwayat aktif
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /riwayat-kerja/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }

    put:
      tags: [Riwayat Kerja]
      summary: Update riwayat (termasuk set tanggal keluar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggalMulai: { type: string, format: date }
                tanggalKeluar: { type: string, format: date, nullable: true, example: "2024-06-30" }
                departemen: { type: string, enum: [TOKO, PROYEK] }
      responses:
        '200':
          description: Riwayat berhasil diperbarui
        '400':
          description: Tanggal keluar sebelum tanggal mulai
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Riwayat Kerja]
      summary: Hapus riwayat kerja
      description: Role **ADMIN** saja.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Absensi ─────────────────────────────────────────────────────

  /absensi:
    get:
      tags: [Absensi]
      summary: Daftar absensi
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: karyawanId, schema: { type: string } }
        - { in: query, name: bulan, schema: { type: integer }, example: 1 }
        - { in: query, name: tahun, schema: { type: integer }, example: 2024 }
        - { in: query, name: status, schema: { type: string, enum: [HADIR, CUTI, PARSIAL] } }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Absensi]
      summary: Catat absensi
      description: |
        - `HADIR` → jamKerja otomatis 8, telatMenit opsional
        - `CUTI` → jamKerja otomatis 0, alasanKetidakhadiran disarankan
        - `PARSIAL` → jamKerja **wajib** diisi 1–7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [karyawanId, tanggal, status]
              properties:
                karyawanId: { type: string, example: KRY001 }
                tanggal: { type: string, format: date, example: "2024-01-02" }
                status: { type: string, enum: [HADIR, CUTI, PARSIAL] }
                jamKerja: { type: integer, minimum: 1, maximum: 7, description: Wajib jika PARSIAL }
                alasanKetidakhadiran: { type: string }
                telatMenit: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Absensi berhasil dicatat
        '400':
          description: Validasi gagal (misal jamKerja kosong saat PARSIAL, atau tanggal sudah ada)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /absensi/rekap/{karyawanId}:
    get:
      tags: [Absensi]
      summary: Rekap absensi bulanan satu karyawan
      parameters:
        - { in: path, name: karyawanId, required: true, schema: { type: string }, example: KRY001 }
        - { in: query, name: bulan, required: true, schema: { type: integer }, example: 1 }
        - { in: query, name: tahun, required: true, schema: { type: integer }, example: 2024 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                success: true
                data:
                  totalHadir: 20
                  totalCuti: 2
                  totalParsial: 1
                  totalJamKerja: 172
                  totalTelatMenit: 30
                  detail: []
        '400':
          description: Parameter bulan dan tahun wajib diisi
        '401':
          $ref: '#/components/responses/Unauthorized'

  /absensi/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }

    put:
      tags: [Absensi]
      summary: Update absensi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [HADIR, CUTI, PARSIAL] }
                jamKerja: { type: integer, minimum: 1, maximum: 7 }
                alasanKetidakhadiran: { type: string }
                telatMenit: { type: integer }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Absensi]
      summary: Hapus absensi
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Pinjaman ────────────────────────────────────────────────────

  /pinjaman:
    get:
      tags: [Pinjaman]
      summary: Daftar pinjaman
      description: Role **ADMIN** atau **MANAGER**.
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
        - { in: query, name: karyawanId, schema: { type: string } }
        - { in: query, name: metodePembayaran, schema: { type: string, enum: [TUNAI, TRANSFER] } }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Pinjaman]
      summary: Catat pinjaman karyawan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [karyawanId, jumlah, tanggal, metodePembayaran]
              properties:
                karyawanId: { type: string, example: KRY001 }
                jumlah: { type: number, example: 500000 }
                alasanPeminjaman: { type: string }
                tanggal: { type: string, format: date, example: "2024-01-10" }
                metodePembayaran: { type: string, enum: [TUNAI, TRANSFER] }
      responses:
        '201':
          description: Pinjaman berhasil dicatat
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /pinjaman/karyawan/{karyawanId}:
    get:
      tags: [Pinjaman]
      summary: Semua pinjaman + total satu karyawan
      parameters:
        - { in: path, name: karyawanId, required: true, schema: { type: string }, example: KRY001 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                success: true
                data:
                  totalPinjaman: 500000
                  data: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pinjaman/{id}:
    delete:
      tags: [Pinjaman]
      summary: Hapus pinjaman
      description: Role **ADMIN** saja.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Hutang ──────────────────────────────────────────────────────

  /hutang:
    get:
      tags: [Hutang]
      summary: Daftar semua transaksi hutang
      description: Role **ADMIN** atau **MANAGER**.
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
        - { in: query, name: karyawanId, schema: { type: string } }
        - { in: query, name: jenis, schema: { type: string, enum: [HUTANG, BAYAR] } }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Hutang]
      summary: Tambah hutang atau catat pembayaran
      description: |
        Gunakan `jenis: HUTANG` untuk menambah hutang baru, `jenis: BAYAR` untuk mencatat pembayaran.
        Pembayaran tidak bisa melebihi saldo hutang yang tersisa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tanggal, karyawanId, jenis, jumlah]
              properties:
                tanggal: { type: string, format: date, example: "2024-01-05" }
                karyawanId: { type: string, example: KRY001 }
                jenis: { type: string, enum: [HUTANG, BAYAR] }
                jumlah: { type: number, example: 200000 }
                keterangan: { type: string, example: Beli semen }
                refNoNota: { type: string, example: INV-001 }
      responses:
        '201':
          description: Berhasil dicatat
        '400':
          description: Jumlah bayar melebihi sisa hutang
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hutang/karyawan/{karyawanId}:
    get:
      tags: [Hutang]
      summary: Saldo + riwayat hutang satu karyawan
      parameters:
        - { in: path, name: karyawanId, required: true, schema: { type: string }, example: KRY001 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                success: true
                data:
                  karyawan: { id: KRY001, nama: Budi Santoso }
                  totalHutang: 200000
                  totalBayar: 100000
                  saldo: 100000
                  riwayat: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /hutang/{id}:
    delete:
      tags: [Hutang]
      summary: Hapus transaksi hutang
      description: Role **ADMIN** saja.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Pembayaran Gaji ─────────────────────────────────────────────

  /pembayaran-gaji/preview:
    get:
      tags: [Pembayaran Gaji]
      summary: Preview kalkulasi gaji sebelum disimpan
      description: |
        Hitung otomatis berdasarkan absensi dan pinjaman dalam periode.
        - **HARIAN**: gajiPokok × (totalJamKerja ÷ 8)
        - **BULANAN**: gajiPokok tetap
        - **Pinjaman**: total pinjaman baru dalam periode
        - **Sisa**: Total − Pinjaman
      parameters:
        - { in: query, name: karyawanId, required: true, schema: { type: string }, example: KRY001 }
        - { in: query, name: periodeAwal, required: true, schema: { type: string, format: date }, example: "2024-01-01" }
        - { in: query, name: periodeAkhir, required: true, schema: { type: string, format: date }, example: "2024-01-31" }
      responses:
        '200':
          description: Kalkulasi berhasil
          content:
            application/json:
              example:
                success: true
                message: Kalkulasi gaji berhasil
                data:
                  periodeAwal: "2024-01-01"
                  periodeAkhir: "2024-01-31"
                  karyawanId: KRY001
                  namaKaryawan: Budi Santoso
                  sistemUpah: HARIAN
                  gajiPokok: 150000
                  jumlahHariKerja: 26.5
                  jumlahJamKerja: 212
                  total: 3975000
                  pinjaman: 500000
                  sisa: 3475000
                  detailAbsensi:
                    totalHadir: 26
                    totalCuti: 1
                    totalParsial: 1
        '400':
          description: Parameter wajib tidak lengkap
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /pembayaran-gaji:
    get:
      tags: [Pembayaran Gaji]
      summary: Daftar pembayaran gaji
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
        - { in: query, name: karyawanId, schema: { type: string } }
        - { in: query, name: bulan, schema: { type: integer }, example: 1 }
        - { in: query, name: tahun, schema: { type: integer }, example: 2024 }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Pembayaran Gaji]
      summary: Simpan pembayaran gaji
      description: Total, hari kerja, jam kerja, dan pinjaman dihitung otomatis dari data absensi & pinjaman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [karyawanId, periodeAwal, periodeAkhir, metodeBayar, tanggalBayar]
              properties:
                karyawanId: { type: string, example: KRY001 }
                periodeAwal: { type: string, format: date, example: "2024-01-01" }
                periodeAkhir: { type: string, format: date, example: "2024-01-31" }
                metodeBayar: { type: string, enum: [TUNAI, TRANSFER] }
                tanggalBayar: { type: string, format: date, example: "2024-02-01" }
      responses:
        '201':
          description: Pembayaran gaji berhasil disimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PembayaranGaji'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /pembayaran-gaji/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }

    get:
      tags: [Pembayaran Gaji]
      summary: Detail slip gaji
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PembayaranGaji'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Pembayaran Gaji]
      summary: Hapus data pembayaran gaji
      description: Role **ADMIN** saja.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
